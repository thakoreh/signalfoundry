name: Verify release candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SIGNALFOUNDRY_MODE: local-demo
      NEXT_PUBLIC_SIGNALFOUNDRY_MODE: local-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: bash scripts/setup.sh
      - run: bash scripts/check.sh
      - name: Install Chromium for browser regression checks
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify desktop, mobile, keyboard, and reduced-motion behavior
        run: npm run test:browser
        working-directory: frontend
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Save compact desktop and mobile mission screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mission-ui-screenshots
          path: |
            frontend/test-results/**/desktop-1440-*.png
            frontend/test-results/**/mobile-390-*.png
          retention-days: 7
          if-no-files-found: ignore
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: frontend
      - run: python -m pip install pip-audit==2.9.0
      - run: pip-audit -r backend/requirements.lock.txt --no-deps --disable-pip
      - run: python scripts/production_preflight.py
      - run: python scripts/test_saas_failclosed.py
      - name: Install verified Gitleaks 8.28.0
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz --output /tmp/gitleaks.tgz
          echo 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tgz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - run: GITLEAKS_BIN=/tmp/gitleaks bash scripts/scan_secrets.sh
  container-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag signalfoundry-preview:ci .
      - run: docker build --file deploy/saas.Dockerfile --tag signalfoundry-saas:ci .
      - run: docker build --file deploy/worker.Dockerfile --tag signalfoundry-worker:ci .
      - run: python3 scripts/production_container_smoke.py
  campaign-walkthrough:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SIGNALFOUNDRY_MODE: local-demo
      NEXT_PUBLIC_SIGNALFOUNDRY_MODE: local-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Render the labelled test-data campaign on desktop and mobile
        run: npm run test:browser -- discovery.spec.ts --grep 'TEST DATA one complete' --project desktop-1440 --project mobile-390
        working-directory: frontend
      - name: Save ordered campaign screenshots and assertions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: campaign-walkthrough-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
  real-business-campaign:
    # Explicit temporary opt-in for the owner's requested one real campaign.
    # Remove [real-case] from the PR title after this run. No live sites are
    # requested by ordinary CI or the normal browser suite.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[real-case]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SIGNALFOUNDRY_MODE: local-demo
      NEXT_PUBLIC_SIGNALFOUNDRY_MODE: local-demo
      SIGNALFOUNDRY_REAL_CASE: ontario-plumbers-20261002
      SIGNALFOUNDRY_DB_PATH: /tmp/signalfoundry-real-case.sqlite3
      DECISION_ENGINE: rules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: bash scripts/setup.sh
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start the real isolated local backend
        run: |
          PYTHONPATH=backend .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/signalfoundry-real-backend.log 2>&1 &
          for i in $(seq 1 40); do curl --fail --silent http://127.0.0.1:8000/api/health && exit 0; sleep 0.5; done
          echo 'Local backend did not become ready'; exit 1
      - name: Research real official business websites and record the actual UI
        run: npx playwright test --config playwright.real.config.ts
        working-directory: frontend
      - name: Save real-business screenshots, evidence and CSV
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-business-campaign-evidence
          path: |
            frontend/real-test-results/
            frontend/real-playwright-report/
            /tmp/signalfoundry-real-backend.log
          retention-days: 7
          if-no-files-found: ignore
